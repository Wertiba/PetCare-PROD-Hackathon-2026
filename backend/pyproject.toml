[project]
name = "petcare-backend"
version = "0.1.0"
description = "petcare backend"
readme = "README.md"
authors = [
    { name = "sazsu", email = "149969207+sazsu@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "click>=8.5.0",
    "dishka>=1.10.1",
    "fastapi>=0.143.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
petcare-backend = "petcare_backend.bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 95

[tool.ruff.lint]
select = ["ALL"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "env",
    "dist",
    "build",
    "docs",
    "benchmarks",
    "tests",
    "alembic",
]

ignore = [
    "A003", # Python builtin is shadowed by class attribute {name} from {row}
    "B008", # Do not perform function call {name} in argument defaults
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "B024", # `Recognizer` is an abstract base class, but it has no abstract methods
    "B027", # `PushNotifier.send` is an empty method in an abstract base class, but has no abstract decorator
    "S101", # Use of `assert` detected
    "PTH123", # `open("foo")` should be replaced by `Path("foo").open()`
    "RET504", # Unnecessary variable assignment before `return` statement
    "TRY003", # Avoid specifying long messages outside the exception class
    "EM102", # Exception must not use an f-string literal, assign to variable first
    "N999", # Invalid module name
    "PGH003", # Use specific rule codes when ignoring type issues
    "PGH004", # Use specific rule codes when using `noqa`
    "SIM108", # Use ternary operator `address_id = body["address_id"] if lesson.category == CategoryEnum.B else slot.instructor.address_id` instead of if-else-block
    "ARG005", # Unused lambda argument: `x`
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed in `f`
    "FBT001", # Boolean positional arg in function definition
    "FBT002", # Boolean default value in function definition
    "TD002", # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...`
    "TD003", # Missing issue link on the line following this TODO
    "FIX002", # Line contains TODO, consider resolving the issue
    "EM101", # Exception must not use a string literal, assign to variable first
    "ARG001", # Unused function argument: `code`
    "ARG002", # Unused method argument: `now`
    "ISC001", # Implicitly concatenated string literals on one line
    "COM812", # Explicitly concatenated string should be implicitly concatenated
    "PLR0913", # Too many arguments in function definition,
    "A002", # Function argument `id` is shadowing a Python builtin
    "PT003", # `scope='function'` is implied in `@pytest.fixture()`
    "S105", # Possible hardcoded password assigned to: "token_type"
    "S106", # Possible hardcoded password assigned to argument: "token_type"
    "PLR0912", # Too many branches (13 > 12)
    "C901", # `handle` is too complex (14 > 12)
]

[tool.ruff.lint.isort]
known-first-party = ["petcare_backend"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
