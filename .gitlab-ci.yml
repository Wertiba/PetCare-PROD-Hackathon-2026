include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/spirit.yaml
      - /jobs/build.yaml
      - /jobs/teleport.yaml
      - /jobs/configure-docker.yaml
      - /jobs/rules.yaml
      - /jobs/ansible.yaml

# workflow:
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#     - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - lint
  - test
  - build

.backend-job:
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

lint-backend:
  extends: .backend-job
  stage: lint
  image: ghcr.io/astral-sh/uv:0.13.0-debian-slim
  script:
    - echo "hello world"

test-backend:
  extends: .backend-job
  stage: test
  image: ghcr.io/astral-sh/uv:0.13.0-debian-slim
  script:
    - echo "hello world"

build-backend:
  stage: build
  extends:
    - .build
    - .backend-job
  needs:
    - lint-backend
    - test-backend
  variables:
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/backend/Dockerfile"
    CONTEXT: "$CI_PROJECT_DIR/backend"
    IMAGE_NAME: "$SPIRIT_REGISTRY/$TENANT/backend:$CI_COMMIT_SHORT_SHA"

build-frontend:
  stage: build
  extends: .build
  variables:
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/frontend/Dockerfile"
    CONTEXT: "$CI_PROJECT_DIR/frontend"
    IMAGE_NAME: "$SPIRIT_REGISTRY/$TENANT/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - exists:
        - frontend/Dockerfile
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
