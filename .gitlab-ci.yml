include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/spirit.yaml
      - /jobs/build.yaml
      - /jobs/rules.yaml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - lint
  - test
  - build
  - deploy

.production-job:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.backend-job:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

lint-caddy:
  stage: lint
  image: caddy:2-alpine
  variables:
    DOMAIN: localhost
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - deploy/**/*
        - docker-compose.yaml
        - .gitlab-ci.yml
  script:
    - caddy validate --config deploy/Caddyfile --adapter caddyfile

lint-backend:
  extends: .backend-job
  stage: lint
  image: ghcr.io/astral-sh/uv:0.13.0-debian-slim
  script:
    - cd backend
    - uv sync --locked
    - uv run ruff check .

test-backend:
  extends: .backend-job
  stage: test
  image: ghcr.io/astral-sh/uv:0.13.0-debian-slim
  script:
    - cd backend
    - uv sync --locked
    - >-
      uv run python -m pytest
      --cov --cov-report=term --cov-report=xml:reports/coverage.xml --cov-report=html
      --junitxml=reports/junit.xml --req-report=reports/requirements-coverage.md
  coverage: '/^TOTAL\s+.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expose_as: backend test reports
    paths:
      - backend/reports/
    reports:
      junit: backend/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/reports/coverage.xml
    expire_in: 30 days

build-backend:
  stage: build
  extends:
    - .build
    - .backend-job
  needs:
    - lint-backend
    - test-backend
  variables:
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/backend/Dockerfile"
    CONTEXT: "$CI_PROJECT_DIR/backend"
    IMAGE_NAME: "$SPIRIT_REGISTRY/$TENANT/backend:$CI_COMMIT_SHA"

build-frontend:
  stage: build
  extends: .build
  variables:
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/frontend/Dockerfile"
    CONTEXT: "$CI_PROJECT_DIR/frontend"
    IMAGE_NAME: "$SPIRIT_REGISTRY/$TENANT/frontend:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - exists:
        - frontend/Dockerfile
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

deploy-production:
  stage: deploy
  image: alpine:3
  extends: .production-job
  needs:
    - lint-caddy
    - build-backend
    - build-frontend
  resource_group: production
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
  script:
    - |
      target="$DEPLOY_SSH_USER@$DEPLOY_VM"
      printf '%s\n' \
        "FRONTEND_IMAGE=$SPIRIT_REGISTRY/$TENANT/frontend:$CI_COMMIT_SHA" \
        "BACKEND_IMAGE=$SPIRIT_REGISTRY/$TENANT/backend:$CI_COMMIT_SHA" \
        "DOMAIN=$DOMAIN" \
        "DB_PASSWORD=$DB_PASSWORD" \
        "APP_SECURITY_JWT_SECRET=$APP_SECURITY_JWT_SECRET" > .env.deploy
    - ssh -o StrictHostKeyChecking=no "$target" "mkdir -p petcare/deploy"
    - scp -o StrictHostKeyChecking=no docker-compose.yaml "$target:petcare/docker-compose.yaml"
    - scp -o StrictHostKeyChecking=no deploy/Caddyfile "$target:petcare/deploy/Caddyfile"
    - scp -o StrictHostKeyChecking=no .env.deploy "$target:petcare/.env"
    - |
      ssh -o StrictHostKeyChecking=no "$target" '
        set -eu
        umask 077
        key_file=$(mktemp)
        trap "rm -f \"$key_file\" \"$key_file.dp\"" EXIT
        cat > "$key_file"
        if [ ! -x /usr/local/bin/dp ]; then
          if ! command -v curl >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y curl
          fi
          curl -fL "https://spirit.t-education.com/cli/tedu/14.1.3/linux/dp" -o "$key_file.dp"
          sudo -n install -m 0755 "$key_file.dp" /usr/local/bin/dp
        fi
        sudo -n /usr/local/bin/dp auth service-acc --key-file "$key_file"
        sudo -n /usr/local/bin/dp auth configure-docker
        cd petcare
        sudo -n docker compose pull
        sudo -n docker compose up -d
        sudo -n docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
      ' < "$SPIRIT_DOCKER_SA_KEY"
