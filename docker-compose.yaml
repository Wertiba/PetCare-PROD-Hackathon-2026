services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the deployment hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the production frontend image}
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--location", "--max-time", "4", "--output", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the production backend image}
    environment:
      APP_NAME:
      DB_DRIVER:
      DB_ECHO:
      DB_ECHO_POOL:
      DB_POOL_SIZE:
      DB_MAX_OVERFLOW:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: petcare
      DB_USER: petcare
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to the database password}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?Set APP_SECURITY_JWT_SECRET to a random secret}
      APP_SECURITY_ACCESS_TOKEN_EXPIRATION:
      APP_SECURITY_REFRESH_TOKEN_EXPIRATION:
      APP_SECURITY_PASSWORD_SCHEME:
      APP_SECURITY_ALGORITHM:
      APP_COOKIE_SECURE:
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://${DOMAIN}}
      LOG_CONSOLE_LEVEL:
      LOG_CONSOLE_ENQUEUE:
      LOG_CONSOLE_BACKTRACE:
      LOG_CONSOLE_DIAGNOSE:
      LOG_CONSOLE_FORMAT:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-https://${DOMAIN}}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${PHOTOS_ACCESS_KEY:?Set PHOTOS_ACCESS_KEY to the photo application access key}
      S3_SECRET_KEY: ${PHOTOS_SECRET_KEY:?Set PHOTOS_SECRET_KEY to the photo application secret}
      S3_PRESIGNED_TTL: ${S3_PRESIGNED_TTL:-604800}
      LLM_PROXY_URL:
      LLM_PROXY_API_KEY:
      LLM_AVATAR_MODEL:
      LLM_IMAGE_TOOL_MODEL:
      LLM_AVATAR_TIMEOUT:
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--location", "--max-time", "2", "--output", "/dev/null", "http://127.0.0.1:8000/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:?Set RUSTFS_ROOT_ACCESS_KEY to the storage administrator access key}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?Set RUSTFS_ROOT_SECRET_KEY to the storage administrator secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    command: ["rustfs", "/data"]
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  rustfs-init:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the production backend image}
    command: ["python", "-m", "app.infra.photos.provision"]
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-https://${DOMAIN}}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PRESIGNED_TTL: ${S3_PRESIGNED_TTL:-604800}
      S3_ACCESS_KEY: ${PHOTOS_ACCESS_KEY:?Set PHOTOS_ACCESS_KEY to the photo application access key}
      S3_SECRET_KEY: ${PHOTOS_SECRET_KEY:?Set PHOTOS_SECRET_KEY to the photo application secret}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:?Set RUSTFS_ROOT_ACCESS_KEY to the storage administrator access key}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?Set RUSTFS_ROOT_SECRET_KEY to the storage administrator secret}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to the database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  rustfs_data:
  postgres_data:
