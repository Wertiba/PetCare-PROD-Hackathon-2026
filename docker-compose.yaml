services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the deployment hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the production frontend image}
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--location", "--max-time", "4", "--output", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the production backend image}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: petcare
      DB_USER: petcare
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to the database password}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?Set APP_SECURITY_JWT_SECRET to a random secret}
      APP_SECURITY_ACCESS_TOKEN_EXPIRATION: 15m
      APP_SECURITY_REFRESH_TOKEN_EXPIRATION: 30d
      APP_COOKIE_SECURE: "true"
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    volumes:
      - backend_media:/app/src/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--location", "--max-time", "2", "--output", "/dev/null", "http://127.0.0.1:8000/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to the database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  backend_media:
  postgres_data:
