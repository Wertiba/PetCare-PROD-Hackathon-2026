services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the deployment hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the production frontend image}
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--location", "--max-time", "4", "--output", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the production backend image}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--location", "--max-time", "2", "--output", "/dev/null", "http://127.0.0.1:8000/api/v1/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
